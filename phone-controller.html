<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050b18"><title>AETHER NOVA · Mando móvil</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#050b18;color:#eaf7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#123456 0%,#071326 45%,#030711 100%);display:flex;justify-content:center;touch-action:manipulation;user-select:none}main{width:min(100%,560px);min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}header{text-align:center}header small{letter-spacing:.24em;color:#66dfff;font-size:10px}h1{font-size:clamp(22px,6vw,32px);letter-spacing:.1em;margin:5px 0}header p{color:#9bb3c8;font-size:12px;margin:0}.panel{background:rgba(8,23,43,.88);border:1px solid rgba(88,204,255,.25);border-radius:18px;padding:15px;box-shadow:0 12px 40px #0005}.connect{display:grid;grid-template-columns:1fr auto;gap:9px}input{min-width:0;background:#030b18;border:1px solid #24516c;border-radius:10px;color:white;padding:13px;font-size:18px;letter-spacing:.16em;text-align:center;text-transform:uppercase}button{border:1px solid #3fcdf7;border-radius:11px;background:linear-gradient(135deg,#087ba5,#1452a5);color:white;font-weight:800;letter-spacing:.06em;padding:12px 15px}#status{text-align:center;color:#9cb5c8;font-size:11px;letter-spacing:.1em;margin-top:10px}.online{color:#63ffc4!important}#controls{display:none;flex:1;gap:14px;flex-direction:column;justify-content:space-between}.dpad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}.hold{height:clamp(100px,22vh,160px);font-size:clamp(24px,8vw,40px);background:linear-gradient(160deg,#123c5d,#08192e);border:1px solid #3a9dc5;box-shadow:inset 0 0 25px #26bfff18,0 8px 20px #0006;touch-action:none}.hold.active{background:linear-gradient(160deg,#087da5,#124c91);box-shadow:0 0 26px #27caff55;transform:scale(.98)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{height:clamp(86px,18vh,125px);font-size:15px;border-radius:50%;aspect-ratio:1;max-width:145px;justify-self:center;background:radial-gradient(circle at 35% 25%,#ed5b83,#851d50 65%,#3c1034);border-color:#ff8bb0;box-shadow:0 0 25px #ff4e9130}.action.pause{background:radial-gradient(circle at 35% 25%,#3c9fc2,#17416f 65%,#0a1c38);border-color:#75dfff}.hint{text-align:center;color:#809ab0;font-size:10px;line-height:1.5}@media(orientation:landscape) and (max-height:520px){main{max-width:900px;padding:8px 16px;gap:8px}header{display:flex;align-items:center;justify-content:space-between}header p{display:none}#controls{flex-direction:row;align-items:center}.dpad{width:55%}.hold{height:28vh;min-height:90px}.actions{width:38%;align-items:center}.action{height:26vh;max-height:110px}}
</style></head><body><main><header><small>CONTROL REMOTO INALÁMBRICO</small><h1>AETHER NOVA</h1><p>Tu celular se convierte en el joystick de la nave.</p></header><section class="panel" id="join"><div class="connect"><input id="code" maxlength="8" autocomplete="one-time-code" placeholder="CÓDIGO" aria-label="Código de vinculación"><button id="connect">VINCULAR</button></div><div id="status">INGRESÁ EL CÓDIGO QUE MUESTRA LA PC</div></section><section id="controls"><div class="dpad"><button class="hold" data-hold="left" aria-label="Mover a la izquierda">◀</button><button class="hold" data-hold="right" aria-label="Mover a la derecha">▶</button></div><div class="actions"><button class="action" data-pulse="bomb">SUPERNOVA</button><button class="action pause" data-pulse="pause">PAUSA</button></div><div class="hint">Mantené ◀ ▶ para mover. Tocá SUPERNOVA para usar una bomba.<br>El disparo principal continúa automáticamente.</div></section></main>
<script src="./cloud-config.js"></script><script type="module">
const statusEl=document.getElementById("status"),codeEl=document.getElementById("code"),join=document.getElementById("join"),controls=document.getElementById("controls");const input={l:false,r:false,b:false,p:false};let client=null,channel=null,connected=false,lastSent="";
const setStatus=(s,ok=false)=>{statusEl.textContent=s;statusEl.classList.toggle("online",ok);};const codeFromUrl=new URLSearchParams(location.search).get("code");if(codeFromUrl)codeEl.value=codeFromUrl.toUpperCase().slice(0,8);
async function send(force=false){if(!connected||!channel)return;const packed=JSON.stringify(input);if(!force&&packed===lastSent)return;lastSent=packed;try{await channel.send({type:"broadcast",event:"input",payload:{l:input.l,r:input.r,b:input.b,p:input.p,t:Date.now()}});}catch(e){}}
async function connect(){try{const cfg=window.AETHER_CLOUD_CONFIG;if(!cfg?.enabled||!cfg.supabaseUrl||!cfg.anonKey)throw new Error("Configuración online no disponible.");const code=codeEl.value.trim().toUpperCase();if(!/^[A-F0-9]{8}$/.test(code))throw new Error("El código debe tener 8 caracteres.");setStatus("CONECTANDO A LA PC…");const sdk=await import("https://esm.sh/@supabase/supabase-js@2");client=sdk.createClient(cfg.supabaseUrl,cfg.anonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:25}}});channel=client.channel("aether-phone-"+code,{config:{private:false,broadcast:{ack:false,self:false}}});channel.subscribe(s=>{if(s==="SUBSCRIBED"){connected=true;join.style.display="none";controls.style.display="flex";setStatus("JOYSTICK CONECTADO · LISTO PARA JUGAR",true);send(true);}else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"){connected=false;setStatus("NO SE PUDO CONECTAR. REVISÁ EL CÓDIGO Y REALTIME.");}});}catch(e){setStatus(e.message||"ERROR DE CONEXIÓN");}}
document.getElementById("connect").addEventListener("click",connect);codeEl.addEventListener("keydown",e=>{if(e.key==="Enter")connect();});
document.querySelectorAll("[data-hold]").forEach(btn=>{const key=btn.dataset.hold==="left"?"l":"r";const down=e=>{e.preventDefault();input[key]=true;btn.classList.add("active");try{btn.setPointerCapture(e.pointerId);}catch(_){}send(true);};const up=e=>{if(e)e.preventDefault();input[key]=false;btn.classList.remove("active");send(true);};btn.addEventListener("pointerdown",down);["pointerup","pointercancel","lostpointercapture","contextmenu"].forEach(t=>btn.addEventListener(t,up));});
document.querySelectorAll("[data-pulse]").forEach(btn=>{const key=btn.dataset.pulse==="bomb"?"b":"p";btn.addEventListener("pointerdown",e=>{e.preventDefault();input[key]=true;btn.classList.add("active");send(true);});const up=e=>{if(e)e.preventDefault();input[key]=false;btn.classList.remove("active");send(true);};["pointerup","pointercancel","pointerleave","contextmenu"].forEach(t=>btn.addEventListener(t,up));});
setInterval(()=>send(),50);window.addEventListener("pagehide",()=>{input.l=input.r=input.b=input.p=false;send(true);try{client?.removeChannel(channel);}catch(_){}});document.addEventListener("visibilitychange",()=>{if(document.hidden){input.l=input.r=input.b=input.p=false;send(true);}});
</script></body></html>
