name: Blender asset prototype

on:
  workflow_dispatch:
  pull_request:
    branches: [main, assets/blender-prototype-phase-1]
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-assets.yml"
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-assets.yml"

permissions:
  contents: read

jobs:
  generate-interceptor:
    name: Generate Valkyrie interceptor prototype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and exporter dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Verify Blender Python dependencies
        run: |
          blender --version
          blender --background --python-expr "import numpy; print('NumPy available:', numpy.__version__)"

      - name: Generate Blender project and GLB
        run: |
          blender --background --python-exit-code 1 --python tools/blender/generate_interceptor.py -- --output-dir dist
          echo "Generated files:"
          find . -maxdepth 3 -type f -name 'aether-nova-interceptor*' -print

      - name: Verify generated assets
        run: |
          test -s dist/aether-nova-interceptor.blend
          test -s dist/aether-nova-interceptor.glb
          test -s dist/aether-nova-interceptor-preview.png
          file dist/*

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: aether-nova-interceptor-prototype
          path: dist/
          if-no-files-found: error
          retention-days: 14
