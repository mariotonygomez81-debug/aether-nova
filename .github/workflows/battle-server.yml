name: Battle server checks

on:
  pull_request:
    paths:
      - "multiplayer-server/**"
      - ".github/workflows/battle-server.yml"
  push:
    branches: [main]
    paths:
      - "multiplayer-server/**"
      - ".github/workflows/battle-server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplayer-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
