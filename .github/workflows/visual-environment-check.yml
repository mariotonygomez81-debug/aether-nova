name: Visual environment quality checks

on:
  pull_request:
    paths:
      - "aether3d.js"
      - "game.js"
      - "index.html"
      - "platform-runtime.js"
      - ".github/workflows/visual-environment-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 3D renderer JavaScript syntax
        run: node --input-type=module --check < aether3d.js
      - name: Validate game engine JavaScript syntax
        run: node --check < game.js
      - name: Verify adaptive environment safeguards
        run: |
          grep -q 'qualityTier==="low"?40' aether3d.js
          grep -q 'qualityTier!=="low"' aether3d.js
          grep -q 'AETHER_PLANETARY_BACKDROP' aether3d.js
          grep -q 'cosmicDust' aether3d.js
          grep -q 'enemySensor' aether3d.js
          grep -q 'bossVent' aether3d.js
          grep -q 'bossShield' aether3d.js
          grep -q 'asteroid-surface-details' aether3d.js
          grep -q 'sharedGeometry' aether3d.js
          grep -q 'qualityTier==="low"?1:qualityTier==="medium"?2:3' aether3d.js
          grep -q 'AETHER_ORBITAL_STATION' aether3d.js
          grep -q 'station-docking-ring' aether3d.js
          grep -q 'maxBursts=qualityTier' aether3d.js
          grep -q 'depthSpeed' game.js
          grep -q 'powerup-collected' game.js
          grep -q 'credit-collected' game.js
          grep -q 'aether3dId' game.js
          grep -q 'visualScale = item.variant' aether3d.js
          grep -q 'depthTest:false' aether3d.js
          grep -q 'hit.depth' aether3d.js
          grep -q 'pickupGlowTexture' aether3d.js
          grep -q 'powerup-collected",-8-' game.js
          ! grep -q 'aimReticle' aether3d.js
          ! grep -q 'cx="960" cy="405"' index.html
          grep -q 'p.aether3dId||("power-"+p.id)' aether3d.js
          grep -q 'particleCount=qualityTier' aether3d.js
          echo "Adaptive environment and 3D reward-orb checks passed."
