name: Visual refresh checks
on:
  pull_request:
    paths:
      - "index.html"
      - "aether-visual-upgrade.css"
      - "sw.js"
      - "game.js"
      - "test/visual-refresh.test.mjs"
      - ".github/workflows/visual-refresh.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "aether-visual-upgrade.css"
      - "sw.js"
      - "game.js"
      - "test/visual-refresh.test.mjs"
      - ".github/workflows/visual-refresh.yml"
jobs:
  visual-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/visual-refresh.test.mjs
